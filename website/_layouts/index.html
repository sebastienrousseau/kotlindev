{{#extends "base"}}
{{#block "main"}}
<section id="hero" class="hero-section">
  <div class="container hero-container text-center">
    <div class="pill-badge">
      <span class="pill-tag">NEW</span>
      <span class="pill-text">v0.0.4 Unified Release · TMUX IDE · MCP Agent · Worktrees</span>
    </div>
    <h1 class="hero-title">{{headline}}</h1>
    <p class="hero-lead">{{lead}}</p>
    <div class="hero-cta-group">
      <a class="btn btn-primary btn-lg" href="#quickstart">Quick Start</a>
      <a class="btn btn-secondary btn-lg" href="https://github.com/sebastienrousseau/{{name}}" target="_blank" rel="noopener">Star on GitHub</a>
    </div>

    <!-- Authentic 4-Pane TMUX IDE Terminal Grid -->
    <figure class="terminal-preview-card" aria-label="4-Pane TMUX IDE Grid Preview">
      <figcaption class="terminal-header">
        <div class="window-dots">
          <span class="dot dot-red" aria-hidden="true"></span>
          <span class="dot dot-yellow" aria-hidden="true"></span>
          <span class="dot dot-green" aria-hidden="true"></span>
        </div>
        <div class="terminal-tab-bar font-mono">
          <span class="tmux-win-badge">[kotlindev]</span>
          <span class="tab-item active-tab">0:ide* (4 panes)</span>
          <span class="tab-item">1:bash</span>
          <span class="tab-item">2:mcp</span>
        </div>
        <div class="terminal-actions">
          <span class="badge-status font-mono">● Kotlin 2.1 Coroutine Flows (Prefix + i)</span>
        </div>
      </figcaption>

      <div class="tmux-grid">
        <!-- Pane 1: Project Explorer (Left 20%) -->
        <div class="tmux-pane pane-explorer font-mono">
          <div class="pane-header">
            <span class="pane-title">1: Explorer</span>
            <span class="pane-badge">/work</span>
          </div>
          <div class="pane-content explorer-content">
<div class="tree-node dir">▼ src/</div>
<div class="tree-node dir">  ▼ main/kotlin/dev/</div>
<div class="tree-node file active">    ▶ Pipeline.kt</div>
<div class="tree-node file">      Event.kt</div>
<div class="tree-node dir">  ▼ test/kotlin/dev/</div>
<div class="tree-node file">    PipelineTest.kt</div>
<div class="tree-node file">build.gradle.kts</div>
          </div>
        </div>

        <!-- Center Column: Pane 2 (Editor Top) + Pane 3 (Terminal Bottom) -->
        <div class="tmux-center-col">
          <!-- Pane 2: Editor (Neovim LSP) -->
          <div class="tmux-pane pane-editor font-mono">
            <div class="pane-header">
              <span class="pane-title">2: Neovim (LSP)</span>
              <span class="pane-file">src/main/kotlin/dev/Pipeline.kt</span>
            </div>
            <div class="pane-content editor-content" tabindex="0" role="region" aria-label="Neovim Code Editor">
              <pre class="editor-code font-mono"><code><span class="code-comment">// src/main/kotlin/dev/Pipeline.kt · Kotlin 2.1 Coroutines</span>
<span class="code-kw">sealed interface</span> <span class="code-type">Event</span> {
    <span class="code-kw">data class</span> <span class="code-type">Message</span>(<span class="code-kw">val</span> topic: <span class="code-type">String</span>, <span class="code-kw">val</span> body: <span class="code-type">String</span>) : <span class="code-type">Event</span>
    <span class="code-kw">data object</span> <span class="code-type">Heartbeat</span> : <span class="code-type">Event</span>
}

<span class="code-kw">suspend fun</span> <span class="code-fn">processEvents</span>(flow: <span class="code-type">Flow</span>&lt;<span class="code-type">Event</span>&gt;): <span class="code-type">Result</span>&lt;<span class="code-type">Summary</span>&gt; = <span class="code-fn">coroutineScope</span> {
    <span class="code-kw">val</span> total = flow.<span class="code-fn">filterIsInstance</span>&lt;<span class="code-type">Event.Message</span>&gt;()
        .<span class="code-fn">map</span> { it.body.length }
        .<span class="code-fn">reduce</span> { acc, len -&gt; acc + len }
    <span class="code-type">Result</span>.<span class="code-fn">success</span>(<span class="code-type">Summary</span>(bytes = total))
}</code></pre>
            </div>
          </div>

          <!-- Pane 3: Integrated Shell / Test Runner -->
          <div class="tmux-pane pane-terminal font-mono">
            <div class="pane-header">
              <span class="pane-title">3: Shell / Tests</span>
              <span class="pane-badge">idle</span>
            </div>
            <div class="pane-content terminal-content font-mono" tabindex="0" role="region" aria-label="Integrated Terminal">
<div class="cli-line"><span class="mcp-tl-ps">$ </span>./gradlew test ktlintCheck</div>
<div class="cli-out">&gt; Task :test PASSED (18 tests in 0.22s)</div>
<div class="cli-out cli-ok">✓ BUILD SUCCESSFUL in 380ms · Kotlin 2.1</div>
            </div>
          </div>
        </div>

        <!-- Pane 4: AI Agent / MCP Server (Right 24%) -->
        <div class="tmux-pane pane-ai font-mono">
          <div class="pane-header">
            <span class="pane-title">4: Claude Code</span>
            <span class="pane-badge ai-badge">MCP Agent</span>
          </div>
          <div class="pane-content ai-content font-mono" tabindex="0" role="region" aria-label="AI Agent Panel">
<div class="ai-prompt"><span class="ai-sym">&gt;</span> Claude Code (MCP)</div>
<div class="ai-tool">⏺ Tool: kls.typecheck()</div>
<div class="ai-res">✓ Flow type narrowing &amp; inline verified</div>
<div class="ai-tool">⏺ Tool: ktlint.format()</div>
<div class="ai-res">✓ Zero style violations detected</div>
          </div>
        </div>
      </div>

      <!-- TMUX Status Bar -->
      <div class="tmux-status-bar font-mono">
        <span class="status-left">[kotlindev:ide*] 0:nvim* 1:gradle 2:claude "kotlindev-ide" 23:55</span>
        <span class="status-center">muxtree: main (clean) · mcp: stdio (JSON-RPC)</span>
        <span class="status-right">23:55 29-Aug-26</span>
      </div>
    </figure>
  </div>
</section>

<!-- Content sections rendered from Markdown -->
<div class="content-sections">
  {{!content}}
</div>

{{/block}}
